[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "health-connect-web"
version = "0.1.0"
description = "Personal health portfolio that ingests Samsung Health Connect exports and serves a shareable web view."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Joe Aguirre" }]
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "authlib>=1.3",
    "httpx>=0.27",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "google-cloud-secret-manager>=2.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "black>=24.10",
    "httpx>=0.27",
]

[project.scripts]
hcw-web = "health_connect_web.web.__main__:main"
hcw-sync = "health_connect_web.sync.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"health_connect_web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# B008 is FastAPI's standard idiom (`x: T = Depends(...)`); not a real bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/health_connect_web/models.py" = ["E501"]  # SQLAlchemy column decls are naturally wide

[tool.black]
line-length = 110
target-version = ["py311"]

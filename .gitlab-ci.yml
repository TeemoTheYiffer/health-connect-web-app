# Stub. Wire up when ready to deploy from CI; until then this just runs lint + tests.
# When wiring up, follow the homebase-gcal-integration pattern but adapt to GitLab:
#  - Use https://docs.gitlab.com/ee/ci/cloud_services/google_cloud/ to mint a GCP token
#    via the project's OIDC ID token.
#  - Push image to ${CI_REGISTRY} OR Artifact Registry directly.
#  - Run `terraform plan` on MRs, `terraform apply` on main.
#  - After apply, push out-of-band secret versions if changed.
#
# Required GitLab project variables (Settings > CI/CD > Variables):
#   GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_POOL, GCP_DEPLOYER_SA

stages:
  - lint
  - test

default:
  image: python:3.12-slim
  before_script:
    - pip install -e ".[dev]"

lint:
  stage: lint
  script:
    - ruff check .
    - black --check .

test:
  stage: test
  script:
    - pytest
